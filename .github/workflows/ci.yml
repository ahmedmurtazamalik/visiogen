name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run focused lint
        run: >-
          uvx --from ruff==0.16.3 ruff check
          src/visiogen/critic.py
          src/visiogen/design.py
          src/visiogen/designer.py
          src/visiogen/pipeline.py
          src/visiogen/preview.py
          src/visiogen/validation.py
          src/visiogen/providers/codex_cli.py
          tests/providers/test_codex_cli.py
          tests/test_cli.py
          tests/test_critic.py
          tests/test_design.py
          tests/test_designer.py
          tests/test_hybrid_connector_hints.py
          tests/test_pipeline.py
          tests/test_preview.py
          tests/test_validation.py

      - name: Run focused type checks
        run: >-
          uv run --with mypy==2.3.1 mypy
          --follow-imports=skip
          --ignore-missing-imports
          src/visiogen/critic.py
          src/visiogen/design.py
          src/visiogen/designer.py
          src/visiogen/pipeline.py
          src/visiogen/preview.py
          src/visiogen/validation.py
          src/visiogen/providers/codex_cli.py

      - name: Build distributions
        run: uv build
