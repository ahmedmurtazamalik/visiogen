[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "visiogen"
version = "0.1.0"
description = "Generate Visio diagrams and analyze diagrams in PDF or DOCX documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0,<2",
  "httpx>=0.28,<1",
  "networkx>=3.4,<4",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "vsdx==0.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
visiogen = "visiogen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visiogen"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires an external model provider or desktop application",
]
